name: Deploy site to Cloudflare Pages

# Direct Upload, deliberately: the Pages GitHub integration would need a
# dashboard-only OAuth grant over the GitHub account, and the maintainer's Mac
# has no Node, so wrangler runs here rather than locally.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the association file is not valid JSON
        run: python3 -c "import json;json.load(open('public/.well-known/apple-app-site-association'));print('ok')"

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tina-site --branch=main
